<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D12">
<title>CJC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#0D0D12;--card:#1A1A24;--tx:#F5F5F7;--mu:#A3A3B5;--bl:#0A6CE0;--or:#FF9A00;--ye:#FFC800;--pk:#F0145A;--vi:#8A12C8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.tab{display:none;padding:16px;max-width:560px;margin:0 auto}.tab.on{display:block}
h1{font-size:24px;margin:8px 0 16px}h2{font-size:15px;margin:22px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.logo{display:block;width:78%;max-width:300px;margin:8px auto 4px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border-left:4px solid var(--bl)}
.card.v{border-color:var(--vi)}.card.e{border-color:var(--or)}
.card h3{margin:0 0 4px;font-size:17px}.d{color:var(--mu);font-size:14px;margin-bottom:6px}.ref{color:var(--ye);font-weight:600;margin-top:8px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;color:#fff;background:var(--bl);cursor:pointer;width:100%}
.or{background:var(--or);color:#1a1200;width:auto;padding:8px 16px;margin-top:8px}
label{display:block;margin:14px 0 6px;color:var(--mu);font-size:14px}
input,select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid #33334a;background:#12121a;color:var(--tx)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ph{aspect-ratio:1;border-radius:14px;display:flex;align-items:flex-end;padding:10px;font-size:13px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#12121a;border-top:1px solid #2a2a3a;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;color:var(--mu);font-size:11px;padding:6px 2px;flex:1;border-radius:10px;font-weight:500}
nav button span{display:block;font-size:22px;line-height:1.2}nav button.on{color:var(--or)}
.note{color:var(--mu);font-size:13px;margin-top:10px}
</style></head><body>
